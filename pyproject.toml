[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freesky"
version = "0.2.0"
description = "Like SkyPilot, but only free GPUs: one task YAML, failover across free tiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
modal = ["modal>=1.6"]
kaggle = ["kaggle>=2.2"]
colab = ["google-colab-cli>=0.8"]
lightning = ["lightning-sdk"]
skypilot = ["skypilot"]
beam = ["beam-client"]
mcp = ["mcp>=1.0"]
all = ["modal>=1.6", "kaggle>=2.2", "google-colab-cli>=0.8", "lightning-sdk", "beam-client", "mcp>=1.0"]
dev = ["pytest"]

[project.scripts]
freesky = "freesky.cli:main"

[tool.setuptools.packages.find]
include = ["freesky*"]
